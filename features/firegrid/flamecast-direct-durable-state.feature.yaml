feature:
  name: flamecast-direct-durable-state
  product: firegrid
  description: Rebuild apps/flamecast from stock Durable Streams State and Effect Schema before introducing new Firegrid abstractions.

components:
  SCHEMA_MODEL:
    requirements:
      1: Flamecast persisted row schemas are authored with Effect Schema and passed directly to Durable Streams State via `createStateSchema`.
      2: The first persisted model includes session rows, normalized event rows, and agent template rows derived from the live Flamecast schema vocabulary.
      3: Event rows preserve Flamecast's normalized event union, including turn lifecycle, message, thinking, tool, warning, error, and step-finish variants.
      4: Session rows preserve Flamecast session state fields needed by the UI and public API, including agent, machine, workspace compatibility, status, model, turn count, last message, and error.

  STATE_ACTIONS:
    requirements:
      1: Flamecast writes durable state through `createStreamDB` actions and State Protocol insert/upsert messages.
      2: Session creation validates provider, machine, workspace, and agent-template inputs before appending durable state.
      3: Sending a message appends user input, marks the session running, and creates a turn boundary through one durable action path.
      4: Runtime event ingestion appends normalized event rows and updates the derived session row through one durable action path.

  PROCESSING:
    requirements:
      1: The local Flamecast runtime is an app-owned processor over durable state, not a Firegrid handler or context facade.
      2: The processor observes submitted turns from Durable Streams State and delegates execution to app-owned provider adapters.
      3: Provider adapters emit normalized Flamecast events; they do not write ad hoc UI-specific rows.
      4: Completion, failure, cancellation, and input-required states are derived from normalized events and reflected into session rows.

  CLIENT_READS:
    requirements:
      1: Browser code reads sessions and event history directly from Durable Streams State-backed collections.
      2: Live UI updates subscribe to Durable Streams State collection changes and derive view models in app code.
      3: The first implementation does not introduce a Firegrid client package, runtime package, handler API, context object, or subscription facade.

  PUBLIC_API:
    requirements:
      1: Flamecast exposes the PRD Sessions API over the direct state model, including create, list, get, events, ingest events, cancel, and delete paths.
      2: Provider compatibility checks validate requested provider, model, instructions, capabilities, contributors, provider options, and provider auth before session execution starts.
      3: Provider-facing callbacks append normalized events through the same ingestion action used by app-authored events.
      4: The public event history API returns the normalized Flamecast event contract without provider-specific event shapes leaking into clients.

  PROVIDER_RUNTIME:
    requirements:
      1: Provider adapters implement the PRD provider contract as app-owned code over durable sessions, turns, and events.
      2: Provider adapters accept caller-supplied session and turn identifiers for idempotent retries.
      3: Provider adapters report unsupported capabilities before execution instead of discovering incompatibility through failed runs.
      4: Provider callbacks are verified before event ingestion and normalized before durable append.

constraints:
  ABSTRACTION_DISCIPLINE:
    requirements:
      1: New Firegrid abstractions are deferred until the direct Flamecast implementation repeats a pattern across at least two real app call sites.
      2: Any proposed abstraction must reduce code over direct `createStreamDB`, Effect Schema, or Effect Stream usage without hiding those primitives.
      3: Test-only stores, scenario harnesses, and demo processors are not exported as production package entrypoints.
      4: The implementation must keep Flamecast product concepts inside `apps/flamecast` unless a separate spec promotes a reusable Firegrid primitive.
